name: APB CI Smoke

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Lint RTL
        run: iverilog -g2012 -tnull rtl/apb_ram.sv
      - name: Document UVM simulator requirement
        run: |
          echo "Full APB UVM regression requires VCS, Xcelium, or Questa."
          echo "This CI job is lint-only and intentionally does not claim UVM pass/fail."
